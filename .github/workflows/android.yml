name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "Installed platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "Installed build-tools:"; ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verify PDF engine against real PDFBox (39 checks)
        run: bash tools/verify-engine.sh

      - name: Decode signing keystore
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "Keystore decoded."
          else
            echo "No keystore secret found; the APK will be built unsigned."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Guard - no unexpected permissions
        run: |
          python3 -m pip install --quiet pyaxmlparser
          python3 tools/check-permissions.py

      - name: Guard - launcher background is the intended colour
        run: python3 tools/verify-icon.py app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfsmith-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to a Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --title "PDFsmith build ${{ github.run_number }}" \
            --notes "Signed release APK built automatically from commit ${{ github.sha }}." || true
